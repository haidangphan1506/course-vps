<style>

.when { font-size: 11px; color: var(--muted); }

/* ===== Polish: giao diện gọn và đẹp hơn (nội dung giữ nguyên) ===== */
:root { --bg: #f3f5f9; --panel: #ffffff; --line: #e3e7ee; --soft: #f0f3f8; --accent: #3558d8; --r: 12px; --sh: 0 1px 2px rgba(20,30,60,.05), 0 4px 14px rgba(20,30,60,.04); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f131a; --panel: #171c25; --line: #272e3b; --soft: #1e2430; --sh: 0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"] { --bg: #0f131a; --panel: #171c25; --line: #272e3b; --soft: #1e2430; --sh: 0 1px 2px rgba(0,0,0,.3); }
body { font-size: 14px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; gap: 14px; padding-block: 20px 56px; }

h1 { font-size: 22px; letter-spacing: -.02em; }
.brand .sub { color: var(--muted); font-size: 14px; font-weight: 500; }
/* tab dạng viên thuốc */
.tabs { border-bottom: 0; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; border-radius: 8px; padding: 6px 12px; margin: 0; font-size: 13.5px; color: var(--muted); transition: background .12s, color .12s; }
.tabs button:hover { color: var(--fg); }

.tabs.views { border-bottom: 0; } .tabs.views button { font-size: 14px; padding: 7px 14px; }
.srcnote { background: transparent; }
.srcnote summary, .adv > summary, #p-flow details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; }
.srcnote summary::before, .adv > summary::before { content: "▸ "; } .srcnote[open] summary::before, .adv[open] > summary::before { content: "▾ "; }
.srcnote summary::-webkit-details-marker, .adv > summary::-webkit-details-marker { display: none; }
.srcnote .lead { margin: 6px 0 0; font-size: 12.5px; max-width: 90ch; }
.adv { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--sh); }
.adv[open] { display: grid; gap: 12px; } .adv > summary { font-weight: 500; color: var(--fg); font-size: 13.5px; }
.adv .panel.sub { border: 0; box-shadow: none; padding: 0; border-top: 1px dashed var(--line); padding-top: 12px; }
/* KPI gọn */
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.stat { border-radius: var(--r); box-shadow: var(--sh); padding: 10px 14px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--todo); opacity: .6; }
.stat.pass::before { background: var(--pass); opacity: 1; } .stat.fail::before { background: var(--fail); opacity: 1; } .stat.blocked::before { background: var(--blocked); opacity: 1; }
.stat .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; }
.prog { height: 6px; border-radius: 99px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 460px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.panel { border-radius: var(--r); box-shadow: var(--sh); padding: 14px; }
.panel h2 { font-size: 12px; letter-spacing: .07em; }
/* thẻ nhóm */
.mgrid { gap: 10px; }

.mcard[aria-pressed="true"] { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
/* thanh lọc */

.tag { border-radius: 99px; padding: 1px 8px; }

.gst { border-radius: 99px; }
/* task */
.tk-col { border-radius: var(--r); background: var(--soft); }
.tk-card { border-radius: 10px; box-shadow: 0 1px 2px rgba(20,30,60,.06); transition: box-shadow .12s, transform .12s; }
.tk-card:hover { box-shadow: var(--sh); transform: translateY(-1px); }
.tk-dlg { border-radius: 14px; box-shadow: 0 20px 60px rgba(10,14,22,.35); }
.tk-ty, .tk-pr { border-radius: 99px; padding: 1px 8px; }
@media (max-width: 860px) {
  table.t td.c-h, table.t td.c-au { display: none; }

}
@media (prefers-reduced-motion: reduce) { .mcard, .tk-card, .tabs button { transition: none; } .mcard:hover, .tk-card:hover { transform: none; } }

/* KPI dạng dải mảnh */
.kpis { gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
.kpis .stat { border: 0; border-radius: 0; box-shadow: none; padding: 10px 16px; }
.kpis .stat + .stat { border-left: 1px solid var(--line); }
.kpis .stat::before { top: auto; left: 16px; right: auto; bottom: 8px; width: 18px; height: 3px; border-radius: 2px; }
.kpis .stat .v { font-size: 22px; }

@media (max-width: 460px) { .kpis .stat:nth-child(odd) { border-left: 0; } .kpis .stat:nth-child(even) { border-left: 1px solid var(--line); } .kpis .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }
.vwrap { gap: 12px; }
.svcmq > summary { cursor: pointer; list-style: none; } .svcmq > summary::-webkit-details-marker { display: none; }
.svcmq > summary::before { content: "▸ "; } .svcmq[open] > summary::before { content: "▾ "; }
.kpis .stat::before { display: none; }
.kpis .stat.pass .v, .kpis .stat.fail .v, .kpis .stat.blocked .v { font-weight: 600; }

.kv:empty { display: none; }
.dg.one { grid-template-columns: minmax(0, 1fr); }

/* ===== Mục cần test ===== */

.itm { display: flex; align-items: baseline; gap: 8px; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); font: inherit; min-width: 0; }

.mtd.PUT { color: var(--m-put); background: color-mix(in srgb, var(--m-put) 14%, transparent); }

.tcbar { position: absolute; left: 0; bottom: 0; height: 2px; width: var(--w); background: var(--pass); }

/* ô tích HTTP / RPC dạng nút */
.cks { gap: 6px; margin-top: 6px; }

/* ===================== Tahoe / Liquid Glass ===================== */
:root, :root[data-theme="light"] {
  --fg:#1d1d1f; --muted:#5f6370; --line:rgba(0,0,0,.09); --accent:#0a7cff; --accent-soft:rgba(10,124,255,.12);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --hi:rgba(255,255,255,.85); --edge:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(30,40,80,.12),0 1px 3px rgba(30,40,80,.08); --sh: var(--shadow);
  --panel: var(--glass-strong); --soft: rgba(0,0,0,.045); --todo:#6b7280; --pass:#1f9d55; --fail:#d93a2b; --blocked:#e07a12; --warn:#b7791f; --skip:#8a8f9c;
  --todo-soft:rgba(107,114,128,.14); --doing-soft:rgba(10,124,255,.14); --pass-soft:rgba(31,157,85,.14); --fail-soft:rgba(217,58,43,.13); --blocked-soft:rgba(224,122,18,.15);

  color-scheme: dark; } }
:root[data-theme="dark"] {
  --fg:#f2f2f5; --muted:#a3a8b5; --line:rgba(255,255,255,.1); --accent:#3d9bff; --accent-soft:rgba(61,155,255,.18);

html { background: var(--bg-solid); }
body { margin: 0; font-family: var(--sans); font-size: 14.5px; line-height: 1.5; background: var(--bg); background-attachment: fixed; min-height: 100vh; }
body::before { background: var(--bg-solid); }
.wrap { max-width: 1280px; gap: 16px; padding-top: 20px; }
/* vật liệu kính */
.glass, header.top, .panel, .adv, details.grp, .bar, .tk-col, .tk-dlg, .kpis:not(.hero .kpis) {
  background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7);
  border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi), var(--shadow); border-radius: var(--r); }
header.top { padding: 14px 18px; }
h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }

/* tab kiểu segmented */
.tabs { background: var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.tabs button { color: var(--fg); font-weight: 500; border-radius: 9px; padding: 6px 12px; }
.tabs button[aria-selected="true"] { background: var(--glass-strong); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* hero */
.hero { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.hero .hl { display: grid; gap: 14px; align-content: start; min-width: 0; }
.hero .kpis { display: flex; flex-wrap: wrap; gap: 8px 22px; background: none; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
.hero .kpis .stat { background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; overflow: visible; }
.hero .kpis .stat + .stat { border-left: 0; }
.hero .kpis .stat::before { display: none; }
.hero .kpis .stat .v { font-size: 1.45rem; font-weight: 700; order: -1; line-height: 1.15; }
.hero .kpis .stat { display: flex; flex-direction: column; }
.hero .kpis .stat .l { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--muted); }
.hero .kpis .stat .s { font-size: 11px; }
.hero .prog { margin: 0; height: 8px; border-radius: 99px; background: var(--line); }
.hero .prog i:first-child { background: linear-gradient(90deg, var(--pass), #2ec4a0) !important; }
.next h2 { font-size: .95rem; margin: 0 0 4px; font-weight: 600; }
.next .ph { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.next ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.next li button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 8px; align-items: center; width: 100%; padding: 6px 10px; border-radius: 10px; background: var(--glass-strong); border: 1px solid var(--line); min-width: 0; }
.next li button:hover { border-color: var(--accent); }
.next li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.next .nt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pill { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; white-space: nowrap; background: var(--line); color: var(--muted); flex: none; }
.pill.s-todo { background: var(--todo-soft); color: var(--todo); } .pill.s-fail { background: var(--fail-soft); color: var(--fail); } .pill.s-blocked { background: var(--blocked-soft); color: var(--blocked); } .pill.s-pass { background: var(--pass-soft); color: var(--pass); }
@media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
/* panel, details */
.panel { padding: 14px 16px; } .panel h2 { text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--fg); }
.adv { padding: 12px 16px; } .adv > summary { font-weight: 600; font-size: .95rem; }
.adv .panel.sub { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; padding: 12px 0 0; }
.srcnote summary { color: var(--muted); }
/* toolbar */
.bar { position: sticky; top: 8px; z-index: 20; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
.bar select, .bar input[type=search], .btn, .stsel, .tk-in, .tk-ssel, .rownote, .cf textarea, .cf select, .bulk select { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 9px; color: var(--fg); font-family: var(--sans); }
.bar select:focus, .bar input:focus, .rownote:focus, .stsel:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn { font-weight: 600; border-radius: 9px; padding: 6px 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg { background: var(--line); border: 0; border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border-radius: 9px; color: var(--fg); font-weight: 500; } .seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* nhóm */
.src > h2 { color: var(--muted); font-size: 12.5px; text-transform: none; letter-spacing: 0; font-weight: 600; margin: 8px 4px 0; }

.gst.pass { background: var(--pass-soft); color: var(--pass); } .gst.fail { background: var(--fail-soft); color: var(--fail); } .gst.blocked { background: var(--blocked-soft); color: var(--blocked); } .gst.doing { background: var(--doing-soft); color: var(--accent); }
.gbar { height: 6px; border-radius: 99px; background: var(--line); }
.mcard { background: var(--glass-strong); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; }
/* bảng */
.tw { border-top: 1px solid var(--line); }
table.t th { background: transparent; color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; border-bottom: 1px solid var(--line); }
table.t td { border-bottom: 1px solid var(--line); }
tr.sub td { background: var(--soft); color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; }
.bulk { border-top: 1px solid var(--line); }
tr.r.st-pass { background: color-mix(in srgb, var(--pass) 7%, transparent); }
tr.r.st-fail { background: color-mix(in srgb, var(--fail) 7%, transparent); }
@media (hover: hover) { tr.r:hover td { background: var(--accent-soft); } }

@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 28%, transparent); } 100% { background: transparent; } }
.itx { font-family: var(--mono); font-size: 13px; }
.stsel { font-weight: 500; }
.stsel[data-v="pass"] { background: var(--pass-soft); border-color: transparent; color: var(--pass); }
.stsel[data-v="fail"] { background: var(--fail-soft); border-color: transparent; color: var(--fail); }
.stsel[data-v="blocked"] { background: var(--blocked-soft); border-color: transparent; color: var(--blocked); }
.ck { background: var(--glass-strong); border-color: var(--line); }
.ck:has(input:checked) { background: var(--pass-soft); border-color: transparent; color: var(--pass); }
.tag { border-radius: 99px; } .tag.tcn { background: var(--todo-soft); color: var(--todo); }
.tag.tcn.p { background: var(--pass-soft); color: var(--pass); } .tag.tcn.f { background: var(--fail-soft); color: var(--fail); }
.rownote { border-color: transparent; background: var(--soft); }
tr.dt td { background: var(--soft); }
.tcase, .case { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 12px; }
.tcase.pass { background: var(--pass-soft); border-color: transparent; } .tcase.fail { background: var(--fail-soft); border-color: transparent; }
.case { border-left: 3px solid var(--fail); }
.tcbtn { background: var(--glass-strong); border-color: var(--line); border-radius: 9px; }
/* task */
.tk-col { padding: 0; } .tk-colh { border-bottom: 1px solid var(--line); font-weight: 600; }
.tk-card { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 12px; box-shadow: none; }
.tk-card:hover { border-color: var(--accent); }
.tk-dlg { background: var(--glass-strong); }
.tk-ty, .tk-pr { border: 0; background: var(--line); }

.tk-pr.P0 { background: var(--fail); color: #fff; }
.notice { background: var(--glass); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.exp textarea { background: var(--glass-strong); }
@media (max-width: 860px) {
  .bar { position: static; }
  tr.r.st-pass, tr.r.st-fail, tr.r.st-blocked { background: none !important; }
  tr.r.st-pass { box-shadow: inset 3px 0 0 var(--pass), inset 0 0 0 999px var(--pass-soft); }
  tr.r.st-fail { box-shadow: inset 3px 0 0 var(--fail), inset 0 0 0 999px var(--fail-soft); }
  tr.r.st-blocked { box-shadow: inset 3px 0 0 var(--blocked), inset 0 0 0 999px var(--blocked-soft); }

@media (prefers-reduced-motion: reduce) { tr.r.flash td { animation: none; } }
.hero .kpis .stat .s { display: none; }

/* ===== Bỏ kiểu hộp cho các điều khiển trong dòng ===== */
/* Trạng thái: viên không viền, chấm màu + mũi tên nhỏ */
table.t .stsel { appearance: none; -webkit-appearance: none; border: 0 !important; border-radius: 99px; width: auto; min-width: 0; padding: 3px 24px 3px 22px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  background-color: var(--todo-soft); color: var(--todo);

table.t .stsel[data-v="pass"] { background-color: var(--pass-soft); color: var(--pass); }
table.t .stsel[data-v="fail"] { background-color: var(--fail-soft); color: var(--fail); }
table.t .stsel[data-v="blocked"] { background-color: var(--blocked-soft); color: var(--blocked); }

table.t .stsel option { color: var(--fg); background: var(--bg-solid); }

/* HTTP / RPC: chữ + vòng tròn, không viền */
.cks { gap: 12px; margin-top: 6px; }
.ck, .ck:has(input:checked) { border: 0 !important; background: none !important; padding: 2px 0; border-radius: 0; font-size: 12px; font-weight: 500; color: var(--muted); gap: 5px; }
.ck::before { content: ""; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; box-sizing: border-box; display: inline-block; opacity: .7; }
.ck:has(input:checked) { color: var(--pass); }
.ck:has(input:checked)::before { content: "✓"; opacity: 1; background: var(--pass); border-color: var(--pass); color: #fff; font-size: 9px; font-weight: 700; line-height: 10px; text-align: center; }
.ck:hover { color: var(--fg); }
/* tiến độ case: chữ + thanh mảnh, không nền */
.tag.tcn, .tag.tcn.p, .tag.tcn.f { background: none !important; padding: 0 0 4px; border-radius: 0; font-weight: 500; font-size: 11.5px; min-width: 4.5rem; }
.tag.tcn::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: var(--line); }
.tcbar { z-index: 1; border-radius: 2px; }
.tag.tcn.f .tcbar { background: var(--fail); }
/* ghi chú: chữ thường, chỉ hiện gạch dưới khi rê/nhập */
.rownote, .rownote:hover { background: transparent !important; border: 0 !important; border-bottom: 1px dashed transparent !important; border-radius: 0 !important; padding: 3px 0; }

.rownote:focus { outline: 0 !important; border-bottom: 1px solid var(--accent) !important; }
.rownote::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }

tr.r.st-pass .itx, tr.r.st-skip .itx { color: var(--muted); }
.fm { margin-top: 10px; display: grid; gap: 6px; }
.fm h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.fm .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: var(--mono); font-size: 11.5px; }
.fm .kd { padding: 0 6px; border-radius: 4px; background: var(--soft); color: var(--muted); }

.fm .lk:hover { border-color: var(--accent); }

.hist { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12px; }
.hist li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }

<script>
// Danh mục route lấy trực tiếp từ gateway. Không lấy được thì dùng bản nhúng sẵn.
function apiBase() {
  const q = new URLSearchParams(location.search).get('api');
  if (q) return q.replace(/\/+$/, '');
  return location.protocol + '//' + location.hostname + ':8888';
}
function apiToken() {
  const m = document.cookie.match(/(?:^|;\s*)api_token=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : '';
}
function loadCatalog() {
  return new Promise((resolve) => {
    const done = (c) => resolve(c && Array.isArray(c.items) ? c : null);
    try {
      const x = new XMLHttpRequest(); x.open('GET', apiBase() + '/api-routes/catalog', true);
      const token = apiToken(); if (token) x.setRequestHeader('Authorization', 'Bearer ' + token);
      x.onload = () => { try { if (x.status !== 200) return done(null); const b = JSON.parse(x.responseText); const c = b && b.data && Array.isArray(b.data.items) ? b.data : b; done(c); } catch (e) { done(null); } };
      x.onerror = () => done(null);
      x.send();
    } catch (e) { done(null); }
  });
}
function applyCatalog(c) { LINKS = null; CAT = c; ITEMS = c.items; assignGroups(ITEMS); BYID = new Map(ITEMS.map((i) => [i.id, i])); }
let CAT = null;
let LINKS = null;
let ITEMS = [];
let BYID = new Map();
const SVC_LABEL = { gateway: 'Gateway', user: 'User', tutor: 'Tutor', third: 'Third', ui: 'UI (thao tác)' };
const STATUS = [['todo', 'Chưa test'], ['pass', 'Pass'], ['fail', 'Fail'], ['blocked', 'Blocked'], ['skip', 'Bỏ qua']];
const S_LABEL = Object.fromEntries(STATUS);
const SEV = ['Critical', 'Major', 'Minor'];
const state = { part: 'api', svc: '', mod: '', type: '', status: '', q: '', dev: false, extra: false, docs: {}, names: {}, db: null, user: null, me: null, canWrite: false,
  mstat: '', view: 'grp', bulk: null, openAll: null, expanded: new Set(), draft: {}, exportFmt: 'md' };
let pending = false;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const p2 = (n) => String(n).padStart(2, '0');
const fmtD = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDT = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${fmtD(iso)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
/** Nhóm flow theo domain (auth, admin, student…): RPC/EVENT theo prefix pattern, gateway HTTP theo hop gửi đầu tiên,
 *  route gateway tự xử lý (không qua queue) gộp vào service sở hữu domain cùng tên. */
function assignGroups(items) {
  const owner = new Map();
  items.forEach((r) => {
    r.gown = r.svc; r.gnm = String(r.module || '').toLowerCase();
    if (r.type === 'RPC' || r.type === 'EVENT') { r.gnm = r.path.split('.')[0]; if (!owner.has(r.gnm.toLowerCase())) owner.set(r.gnm.toLowerCase(), { svc: r.svc, name: r.gnm }); }
    else if (r.svc === 'gateway' && r.type === 'HTTP' && r.chain && r.chain.length) {
      const m = /^(?:send|emit) ([\w.\-]+) → (\w+?)_queue/.exec(r.chain[0]);
      if (m) { r.gnm = m[1].split('.')[0]; r.gown = m[2]; }
    }
  });
  items.forEach((r) => {
    if (r.svc === 'gateway' && r.type === 'HTTP' && r.gown === 'gateway') { const o = owner.get(r.gnm); if (o) { r.gnm = o.name; r.gown = o.svc; } }
  });
  const canon = new Map(); // gộp khác biệt hoa/thường (courseProgress / courseprogress)
  items.forEach((r) => { if (r.svc === 'ui') return; const k = r.gnm.toLowerCase(); if (!canon.has(k) || /[A-Z]/.test(r.gnm) && !/[A-Z]/.test(canon.get(k))) canon.set(k, r.gnm); });
  items.forEach((r) => { if (r.svc !== 'ui') r.gnm = canon.get(r.gnm.toLowerCase()); });
}
/* Thứ tự hiển thị module theo flow nghiệp vụ: đăng nhập → quản trị → người dùng → lớp học… → hạ tầng. */
/* Feature → các module liên quan (theo domain nghiệp vụ). Mỗi module gồm: ① gateway HTTP, ② RPC/EVENT, ③ HTTP trực tiếp. */
const FEATURES = [
  ['auth', 'Auth · xác thực & tài khoản', ['auth', 'user']],
  ['admin', 'Admin · quản trị gia sư, học sinh', ['admin', 'student']],
  ['class', 'Lớp học · buổi học, lịch, điểm danh', ['class', 'session', 'schedule', 'attendance']],
  ['content', 'Giáo trình & bài tập', ['curriculum', 'chapter', 'lesson', 'exercise', 'courseprogress']],
  ['finance', 'Báo cáo & học phí', ['report', 'tuition', 'dashboard']],
  ['ai', 'AI & chat', ['ai', 'agents', 'chat']],
  ['notify', 'Thông báo & email', ['notification', 'email']],
  ['system', 'Hệ thống · upload, log, redis, health', ['upload', 'log', 'redis', 'kafka', 'health', 'app', 'apiroutes', 'testscenario']],
];
const FEAT_KEYS = [...FEATURES.map((f) => f[0]), 'other'];
const FEAT_LABEL = Object.fromEntries([...FEATURES.map((f) => [f[0], f[1]]), ['other', 'Khác']]);
const featOf = (name) => { const n = String(name || '').toLowerCase(); const f = FEATURES.find((x) => x[2].includes(n)); return f ? f[0] : 'other'; };
const svcRank = (s) => { const i = FEAT_KEYS.indexOf(s); return i >= 0 ? i : 100 + CAT.order.indexOf(s); };
const FLOW = ['auth', 'admin', 'user', 'student', 'class', 'curriculum', 'chapter', 'lesson', 'session', 'schedule', 'attendance', 'exercise', 'report', 'tuition', 'dashboard', 'courseprogress', 'ai', 'agents', 'chat', 'notification', 'email', 'upload', 'log', 'redis', 'kafka', 'health', 'app', 'apiroutes'];
const UI_FLOW = ['login', 'register', 'forgot-password', 'reset-password', '(global)', '', 'users', 'tutors', 'students', 'classes', 'curriculum', 'sessions', 'schedule', 'grades', 'fees', 'reports', 'notifications', 'discussions', 'ai-chat', 'settings', 'logger', 'test-monitor'];
function modRank(svc, name) {
  const n = String(name || '');
  const ft = FEATURES.find((x) => x[0] === svc); if (ft) { const k = ft[2].indexOf(n.toLowerCase()); return k < 0 ? 999 : k; }
  const i = svc === 'ui' ? UI_FLOW.indexOf(n.replace(/^\//, '').split('/')[0]) : FLOW.indexOf(n.toLowerCase());

        td('', 'Trạng thái').append(statusSel(t));
        const m = mem(t.assignee); const wtd = td('', 'Người làm'); wtd.append(avatar(m), document.createTextNode(' ' + (m ? m.name : '—') + ' · ' + (t.role || '')));
        td(overdue(t) ? 'tk-late' : '', 'Hạn').textContent = fmtDay(t.due) || '—'; td('', 'Điểm').textContent = t.est || '—';
        const c = prog(t); td('', 'Checklist').textContent = c.total ? `${c.pass}/${c.base}` + (c.fail ? ` · ${c.fail} fail` : '') + (ready(t) ? ' ✓' : '') : '—';
        body.append(tr); });
      tb.append(body); tw.append(tb); d.append(tw); box.append(d);
    });
    return box;
  }
  function renderMain() {
    const list = visibleTasks(); const main = $('tk-main');
    if (!tasks().length) { main.replaceChildren(el('div', 'empty', state.db ? 'Chưa có task. Bấm "+ Task mới" hoặc "Gợi ý từ checklist".' : 'Đang tải task…')); return; }
    if (!list.length) { main.replaceChildren(el('div', 'empty', 'Không có task nào khớp bộ lọc.')); return; }
    main.replaceChildren(S.mode === 'list' ? renderList(list) : renderBoard(list));
  }

  /* ---------- gợi ý ---------- */
  const uiCluster = (m) => m.startsWith('/classes/[id]/sessions') ? 'classes-sessions' : m === '(global)' ? 'global' : ['/login', '/register', '/forgot-password', '/reset-password'].includes(m) ? 'auth' : (m.split('/')[1] || 'home');
  function suggestions() {
    const all = tasks(); const linked = new Set(); const srcs = new Set();
    all.forEach((t) => { (t.links || []).forEach((i) => linked.add(i)); if (t.src) srcs.add(t.src); });
    const openLinked = new Set(); all.filter((t) => t.status !== 'done').forEach((t) => (t.links || []).forEach((i) => openLinked.add(i)));
    const out = []; const sc = scoped().filter((r) => !r.removed);
    sc.filter((r) => stOf(r) === 'fail' && !openLinked.has(r.id)).forEach((r) => {
      const cs = (doc(r) || {}).cases || []; const sev = cs.some((c) => c.severity === 'Critical') ? 'P0' : cs.some((c) => c.severity === 'Major') ? 'P1' : 'P2';
      out.push({ src: 'fail:' + r.id, type: 'bug', prio: sev, role: r.svc === 'ui' ? 'FE' : 'BE', area: r.svc, title: 'Sửa lỗi ' + (r.type === 'UI' ? r.title : mpOf(r) + ' ' + (r.type === 'HTTP' ? r.path : '')).trim(), links: [r.id],
        desc: cs.map((c, i) => `Case ${i + 1} [${c.severity}]\nInput: ${c.input}\nMong đợi: ${c.expected}\nThực tế: ${c.actual}`).join('\n\n') });
    });
    sc.filter((r) => r.svc !== 'ui' && needsVerify(r) && !linked.has(r.id)).forEach((r) => out.push({ src: 'vf:' + r.id, type: 'verify', prio: 'P2', role: 'BE', area: r.svc, title: 'Xác minh ' + mpOf(r) + (r.type === 'HTTP' ? ' ' + r.path : ''), links: [r.id], desc: (r.flags || []).join('\n') }));
    const gap = new Map(); sc.filter((r) => r.svc === 'ui' && (r.flags || []).some((f) => f.includes('gateway chưa có route')) && !linked.has(r.id)).forEach((r) => { const k = r.module; if (!gap.has(k)) gap.set(k, []); gap.get(k).push(r); });
    gap.forEach((rs, k) => out.push({ src: 'gap:' + k, type: 'feature', prio: 'P1', role: 'BE', area: 'gateway', title: 'Bổ sung API cho trang ' + k + ' (' + rs.length + ' lời gọi)', links: rs.map((r) => r.id), desc: rs.map((r) => r.path).join('\n') }));
    const grp = new Map(); sc.filter((r) => r.svc !== 'ui' && !linked.has(r.id)).forEach((r) => { const k = r.gown + ':' + r.gnm; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(r); });
    grp.forEach((rs, k) => { if (srcs.has('grp:' + k)) return; const [o, n] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)]; const na = rs.filter((r) => r.svc === 'gateway').length, nq = rs.length - na;
      out.push({ src: 'grp:' + k, type: 'test', prio: 'P2', role: 'QA', area: o, title: `Kiểm thử nhóm ${n} (${o}): ` + [na ? na + ' API' : '', nq ? nq + ' queue/HTTP service' : ''].filter(Boolean).join(' + '), links: rs.map((r) => r.id) }); });
    const ui = new Map(); sc.filter((r) => r.svc === 'ui' && !linked.has(r.id)).forEach((r) => { const k = uiCluster(r.module); if (!ui.has(k)) ui.set(k, []); ui.get(k).push(r); });
    ui.forEach((rs, k) => { if (srcs.has('ui:' + k)) return; out.push({ src: 'ui:' + k, type: 'test', prio: 'P2', role: 'QA', area: 'ui', title: `Kiểm thử UI ${k === 'global' ? 'dùng chung' : k === 'auth' ? 'đăng nhập/đăng ký' : '/' + k} (${rs.length} thao tác)`, links: rs.map((r) => r.id) }); });
    return out.filter((s) => !srcs.has(s.src));
  }
  function renderSug() {
    const box = $('tk-sug'); box.hidden = !S.sug; const l = $('tk-sug-list'); const sg = suggestions();
    $('tk-b-sug').textContent = 'Gợi ý từ checklist (' + sg.length + ')';
    if (!S.sug) return; l.replaceChildren();
    if (!sg.length) { l.append(el('div', 'hint', 'Không còn gợi ý: mọi mục fail, cần xác minh và nhóm API/queue đã có task.')); return; }
    const all = el('button', 'btn', 'Tạo tất cả ' + sg.length + ' task'); all.type = 'button'; all.disabled = !state.canWrite;
    all.addEventListener('click', async () => { if (!all.dataset.c) { all.dataset.c = '1'; all.textContent = 'Bấm lần nữa để tạo ' + sg.length + ' task'; return; } all.disabled = true; for (const s of sg) { await saveTask(tid(), { ...s, status: 'backlog' }); } });
    l.append(all);
    sg.forEach((s) => { const r = el('div', 'tk-sgi'); r.append(el('span', 'tk-ty ' + s.type, TTYPE_L[s.type]), el('span', 'tk-pr ' + s.prio, s.prio), el('span', 'tk-sgt', s.title), el('span', 'hint', s.links.length + ' mục · ' + s.role));
      const a = el('button', 'btn', 'Sửa rồi tạo'); a.type = 'button'; a.addEventListener('click', () => openEditor(null, s));
      const b = el('button', 'btn pri', 'Tạo'); b.type = 'button'; b.disabled = !state.canWrite; b.addEventListener('click', () => saveTask(tid(), { ...s, status: 'backlog' }));
      r.append(a, b); l.append(r); });
  }

  /* ---------- editor ---------- */
  function openEditor(id, preset) {
    const t = id ? { ...S.tasks[id] } : { title: '', desc: '', type: 'test', prio: 'P2', status: 'backlog', role: 'QA', area: '', assignee: null, reviewer: null, sprint: S.f.sprint && S.f.sprint !== '__none' ? S.f.sprint : '', due: null, est: null, links: [], comments: [], src: null, ...(preset || {}) };
    S.edit = { id, t }; S.pick = ''; drawEditor();
    const dlg = $('tk-dlg'); try { if (!dlg.open) dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
    setTimeout(() => { const i = $('tk-e-title'); if (i && !id) i.focus(); }, 30);
  }
  function drawEditor() {
    const dlg = $('tk-dlg'); const E = S.edit; if (!E) return; const t = E.t; const ro = !state.canWrite;
    const f = el('form', 'tk-form'); f.method = 'dialog';
    const head = el('div', 'tk-dh'); head.append(el('h2', '', E.id ? 'Sửa task' : 'Task mới')); const x = el('button', 'btn', 'Đóng'); x.type = 'button'; x.addEventListener('click', () => dlg.close()); head.append(x); f.append(head);
    const fld = (label, node, wide) => { const l = el('label', 'tk-f' + (wide ? ' wide' : '')); l.append(el('span', '', label), node); return l; };
    const inp = (k, ph, max) => { const i = el('input', 'tk-in'); i.value = t[k] || ''; i.placeholder = ph || ''; if (max) i.maxLength = max; i.disabled = ro; i.addEventListener('input', () => { t[k] = i.value; }); return i; };
    const sel = (k, opts, empty) => { const s = el('select', 'tk-in'); if (empty) s.append(new Option(empty, '')); opts.forEach(([v, l]) => s.append(new Option(l, v))); s.value = t[k] == null ? '' : t[k]; s.disabled = ro; s.addEventListener('change', () => { t[k] = s.value || null; if (k === 'est') t.est = s.value ? +s.value : null; }); return s; };
    const ti = inp('title', 'Ví dụ: Kiểm thử nhóm class (tutor)', 160); ti.id = 'tk-e-title'; ti.required = true;
    const grid = el('div', 'tk-grid');
    grid.append(fld('Tiêu đề *', ti, true));
    const ds = el('textarea', 'tk-in'); ds.value = t.desc || ''; ds.rows = 3; ds.maxLength = 4000; ds.disabled = ro; ds.placeholder = 'Mô tả, tiêu chí hoàn thành (DoD)…'; ds.addEventListener('input', () => { t.desc = ds.value; });
    grid.append(fld('Mô tả', ds, true));
    grid.append(fld('Loại', sel('type', TTYPE)), fld('Ưu tiên', sel('prio', PRIO)), fld('Trạng thái', sel('status', TST)), fld('Vai trò phụ trách', sel('role', ROLES.map((r) => [r, r]))));
    const ms = Object.entries(S.members).map(([id, m]) => [id, m.name + ' · ' + m.role]).sort((a, b) => a[1].localeCompare(b[1]));
    grid.append(fld('Người làm', sel('assignee', ms, '— Chưa giao —')), fld('Người review', sel('reviewer', ms, '— Không —')));
    const sp = inp('sprint', 'Sprint 1 (02/11–13/11)', 60); const dl = el('datalist'); dl.id = 'tk-sprint-dl'; sprints().filter(Boolean).forEach((s) => dl.append(new Option(s, s))); sp.setAttribute('list', 'tk-sprint-dl');
    const spw = el('div'); spw.append(sp, dl); grid.append(fld('Sprint', spw));
    const due = el('input', 'tk-in'); due.type = 'date'; due.value = t.due || ''; due.disabled = ro; due.addEventListener('change', () => { t.due = due.value || null; }); grid.append(fld('Hạn (dd/MM/yyyy)', due));
    grid.append(fld('Ước lượng (điểm)', sel('est', EST.map((e) => [String(e), e + ' điểm']), '—')), fld('Khu vực', sel('area', AREAS.map((a) => [a, a]), '—')));
    f.append(grid);
    // liên kết checklist
    const lk = el('div', 'tk-links'); lk.append(el('h3', '', 'Liên kết checklist (' + (t.links || []).length + ')'));
    const c = prog(t); if (c.total) lk.append(progEl(t));
    const ul = el('div', 'tk-lk');
    (t.links || []).forEach((iid) => { const r = BYID.get(iid); const row = el('div', 'tk-lki');
      if (!r) { row.append(el('span', 'hint', 'Mục không còn trong danh sách (' + iid + ')')); }
      else { const s = stOf(r); row.append(el('span', 'ty ' + r.type, r.type), el('span', 'mp ' + r.method, mpOf(r)), el('span', 'hd', (pathOf(r) || '') + ' · ' + r.svc), el('span', 'gst ' + (s === 'todo' ? '' : s), S_LABEL[s]));
        const o = el('button', 'btn', 'Mở'); o.type = 'button'; o.addEventListener('click', () => gotoItem(r)); row.append(o); }
      if (!ro) { const rm = el('button', 'btn danger', '×'); rm.type = 'button'; rm.setAttribute('aria-label', 'Bỏ liên kết'); rm.addEventListener('click', () => { t.links = t.links.filter((z) => z !== iid); drawEditor(); }); row.append(rm); }
      ul.append(row); });
    lk.append(ul);
    if (!ro) { const ps = el('input', 'tk-in'); ps.type = 'search'; ps.placeholder = 'Thêm mục: gõ path, pattern hoặc tên thao tác…'; ps.value = S.pick; ps.setAttribute('aria-label', 'Tìm mục checklist để liên kết');
      const res = el('div', 'tk-pick');
      const draw = () => { res.replaceChildren(); const q = S.pick.toLowerCase(); if (q.length < 2) return; const have = new Set(t.links || []);
        ITEMS.filter((r) => !have.has(r.id) && !r.removed && [r.path, r.title, r.handler, r.svc, r.module].join(' ').toLowerCase().includes(q)).slice(0, 8).forEach((r) => { const b = el('button', 'tk-pi'); b.type = 'button'; b.append(el('span', 'ty ' + r.type, r.type), document.createTextNode(' ' + mpOf(r) + ' ' + (pathOf(r) || '') + ' · ' + r.svc)); b.addEventListener('click', () => { t.links = [...(t.links || []), r.id]; S.pick = ''; drawEditor(); const n = dlg.querySelector('.tk-links input[type=search]'); if (n) n.focus(); }); res.append(b); }); };
      ps.addEventListener('input', () => { S.pick = ps.value; draw(); }); draw(); lk.append(ps, res); }
    f.append(lk);
    // bình luận
    if (E.id) { const cm = el('div', 'tk-cm'); cm.append(el('h3', '', 'Trao đổi (' + (t.comments || []).length + ')'));
      (t.comments || []).forEach((x) => { const d = el('div', 'case tk-cmi'); d.append(el('span', 'when', (state.names[x.by] || (x.by === state.me ? 'Bạn' : 'Thành viên')) + ' · ' + fmtDT(x.at)), el('pre', '', x.text)); cm.append(d); });
      if (!ro) { const ta = el('textarea', 'tk-in'); ta.rows = 2; ta.maxLength = 2000; ta.placeholder = 'Viết bình luận, cập nhật tiến độ…'; const b = el('button', 'btn', 'Gửi bình luận'); b.type = 'button';
        b.addEventListener('click', async () => { const v = ta.value.trim(); if (!v) return; const cs = [...(S.tasks[E.id].comments || []), { id: tid(), at: new Date().toISOString(), by: state.me || null, text: v }].slice(-100); t.comments = cs; await saveTask(E.id, { comments: cs }); drawEditor(); });
        cm.append(ta, b); }
      f.append(cm); }
    // hành động
    const act = el('div', 'acts tk-dact'); const msg = el('span', 'hint err');
    if (!ro) { const sv = el('button', 'btn pri', E.id ? 'Lưu thay đổi' : 'Tạo task'); sv.type = 'submit';
      f.addEventListener('submit', async (e) => { e.preventDefault(); if (!String(t.title || '').trim()) { msg.textContent = 'Cần nhập tiêu đề.'; ti.focus(); return; }
        const data = { title: t.title.trim(), desc: (t.desc || '').trim(), type: t.type, prio: t.prio, status: t.status, role: t.role, area: t.area || '', assignee: t.assignee || null, reviewer: t.reviewer || null, sprint: (t.sprint || '').trim(), due: t.due || null, est: t.est ? +t.est : null, links: t.links || [], src: t.src || null };
        const ok = await saveTask(E.id || tid(), data); if (ok) dlg.close(); });
      act.append(sv);
      if (E.id) { const del = el('button', 'btn danger', 'Xoá task'); del.type = 'button'; del.addEventListener('click', () => { if (!del.dataset.c) { del.dataset.c = '1'; del.textContent = 'Bấm lần nữa để xoá'; return; } delTask(E.id); dlg.close(); }); act.append(del); }
    } else act.append(el('span', 'hint', 'Chỉ xem: bạn không có quyền sửa.'));
    if (E.id) { const tt = S.tasks[E.id]; act.append(el('span', 'when', 'Tạo ' + fmtDT(tt.createdAt) + (tt.updatedAt ? ' · cập nhật ' + fmtDT(tt.updatedAt) : ''))); }
    act.append(msg); f.append(act);
    dlg.replaceChildren(f);
  }

  /* ---------- liên thông với checklist ---------- */
  function gotoItem(r) {
    const dlg = $('tk-dlg'); if (dlg.open) dlg.close();
    showView('check'); state.svc = r.svc; state.mod = ''; state.type = ''; state.status = ''; state.q = r.type === 'UI' ? (r.title || '') : (r.path || '');
    const q = document.getElementById('f-q'); if (q) q.value = state.q; state.expanded.add(r.id); syncFilters(); render();
    setTimeout(() => { const n = document.querySelector(`[data-fid="${r.id}st"]`); if (n) n.scrollIntoView({ block: 'center' }); }, 50);
  }
  function itemPanel(r) {
    const box = el('div', 'tk-ip'); const ts = tasks().filter((t) => (t.links || []).includes(r.id));
    box.append(el('div', 'hint', ts.length ? 'Task liên quan' : 'Chưa có task nào cho mục này.'));
    ts.forEach((t) => { const b = el('button', 'tk-pi'); b.type = 'button'; b.append(el('span', 'tk-ty ' + t.type, TTYPE_L[t.type]), document.createTextNode(' ' + t.title + ' · ' + TST_L[t.status] + (mem(t.assignee) ? ' · ' + mem(t.assignee).name : ''))); b.addEventListener('click', () => { showView('task'); openEditor(t.id); }); box.append(b); });
    if (state.canWrite && !r.removed) { const b = el('button', 'btn', 'Tạo task cho mục này'); b.type = 'button';
      b.addEventListener('click', () => { const fail = stOf(r) === 'fail'; const cs = (doc(r) || {}).cases || [];
        showView('task'); openEditor(null, { type: fail ? 'bug' : 'test', prio: fail ? 'P1' : 'P2', role: r.svc === 'ui' ? (fail ? 'FE' : 'QA') : (fail ? 'BE' : 'QA'), area: r.svc, title: (fail ? 'Sửa lỗi ' : 'Kiểm thử ') + (r.type === 'UI' ? r.title : mpOf(r) + (r.type === 'HTTP' ? ' ' + r.path : '')), links: [r.id],
          desc: cs.map((c, i) => `Case ${i + 1} [${c.severity}]\nInput: ${c.input}\nMong đợi: ${c.expected}\nThực tế: ${c.actual}`).join('\n\n') }); });
      box.append(b); }
    return box;
  }

  /* ---------- view ---------- */
  let view = 'check';
  function showView(v) {
    view = v === 'task' ? 'task' : 'check';
    $('v-check').hidden = view !== 'check'; $('v-task').hidden = view !== 'task';
    document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === view)));
    const h = view === 'task' ? '#tasks' : '#checklist'; if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) { location.hash = h; } }
    if (view === 'task') { build(); refresh(); } else render();
  }
  function refresh() {
    if (!S.built) { const b = document.querySelector('#views button[data-v="task"] .tc'); if (b) b.textContent = tasks().length || ''; return; }
    renderTop(); renderSug(); renderMain();
    const b = document.querySelector('#views button[data-v="task"] .tc'); if (b) b.textContent = tasks().length ? String(tasks().filter((t) => t.status !== 'done').length) + ' mở' : '';
    if (S.edit && $('tk-dlg').open && S.edit.id && !S.tasks[S.edit.id]) $('tk-dlg').close();
  }
  function init() {
    document.querySelectorAll('#views button').forEach((b) => b.addEventListener('click', () => showView(b.dataset.v)));
    const fromHash = () => showView(location.hash === '#tasks' ? 'task' : 'check');
    window.addEventListener('hashchange', fromHash); if (location.hash === '#tasks') fromHash();
    (async () => {
      const use = window.claude && window.claude.use ? window.claude.use : null; const db = use ? await use('db') : null; const user = use ? await use('user') : null;
      if (!db) { refresh(); return; }
      const named = async (ids) => { ids = ids.filter((x) => x && !(x in state.names)); if (!ids.length || !user || !user.profiles) return; try { const ps = await user.profiles(ids); ids.forEach((i) => { state.names[i] = (ps[i] && ps[i].name) || ''; }); refresh(); } catch (e) {} };
      db.collection('tasks').limit(1000).onSnapshot((snap) => { const n = {}; snap.docs.forEach((d) => { n[d.id] = d.data() || {}; }); S.tasks = n; S.ready = true; refresh(); if (S.edit && S.edit.id && $('tk-dlg').open) { /* giữ bản đang sửa */ } named([...new Set(Object.values(n).flatMap((t) => (t.comments || []).map((c) => c.by)))]); }, (e) => showNotice('Mất kết nối danh sách task (' + (e && e.code) + ').'));
      db.collection('members').limit(200).onSnapshot((snap) => { const n = {}; snap.docs.forEach((d) => { n[d.id] = d.data() || {}; }); S.members = n; refresh(); });
    })();
  }
  return { init, itemPanel, refresh, showView };
})();

</script></body></html>
