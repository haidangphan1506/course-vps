<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahoe UI cho Hyprland + Quickshell</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><style id="css">
:root{
  --fg:#1d1d1f;--muted:#5f6370;--line:rgba(0,0,0,.09);--accent:#0a7cff;--accent-soft:rgba(10,124,255,.12);
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.82);--hi:rgba(255,255,255,.85);--edge:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(30,40,80,.12),0 1px 3px rgba(30,40,80,.08);
  --todo:#6b7280;--todo-soft:rgba(107,114,128,.14);--doing:#0a7cff;--doing-soft:rgba(10,124,255,.14);
  --blocked:#d93a2b;--blocked-soft:rgba(217,58,43,.13);--done:#1f9d55;--done-soft:rgba(31,157,85,.14);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bg:radial-gradient(1200px 700px at 10% -10%,#a9c8ff 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#f7c6a3 0%,transparent 55%),radial-gradient(1000px 800px at 60% 110%,#c7b6ff 0%,transparent 60%),#e9edf6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#f2f2f5;--muted:#a3a8b5;--line:rgba(255,255,255,.1);--accent:#3d9bff;--accent-soft:rgba(61,155,255,.18);
  --glass:rgba(34,36,46,.6);--glass-strong:rgba(40,42,54,.86);--hi:rgba(255,255,255,.14);--edge:rgba(255,255,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
  --todo:#a3a8b5;--todo-soft:rgba(163,168,181,.16);--doing:#3d9bff;--doing-soft:rgba(61,155,255,.2);
  --blocked:#ff6b5e;--blocked-soft:rgba(255,107,94,.18);--done:#4cd384;--done-soft:rgba(76,211,132,.18);
  --bg:radial-gradient(1200px 700px at 10% -10%,#1d3a73 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#5a3424 0%,transparent 55%),radial-gradient(1000px 800px at 60% 110%,#3a2a6e 0%,transparent 60%),#12131a;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:14.5px;line-height:1.5;color:var(--fg);background:var(--bg);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--shadow);border-radius:18px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
header.top{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){header.top{grid-template-columns:1fr}}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7a5cff);border-radius:99px;transition:width .4s}
.next h2{font-size:.95rem;margin:0 0 8px;font-weight:600}
.next .ph{font-size:13px;color:var(--muted);margin-bottom:8px}
.next ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.next li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line)}
.next li button:hover{border-color:var(--accent)}
.next li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.id{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;z-index:20}
@media (min-width:900px){.toolbar{position:sticky;top:8px}}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--line)}
.tabs button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:transparent;color:var(--fg);padding:6px 12px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--glass-strong);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--fg);background:var(--glass-strong);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:0}
input[type=search]{flex:1 1 180px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:9px;padding:6px 14px;cursor:pointer;border:1px solid transparent;background:var(--accent);color:#fff}
.btn.ghost{background:var(--glass-strong);color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--blocked);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save.ok i{background:var(--done)}.save.busy i{background:var(--accent)}.save.bad i{background:var(--blocked)}
.notice{padding:10px 14px;font-size:13.5px}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.colh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-weight:600;font-size:13.5px}
.colh span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);cursor:pointer;width:100%}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .t{font-weight:500;line-height:1.35}
.card .m{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.p1{background:var(--blocked-soft);color:var(--blocked)}
.pill.s-todo{background:var(--todo-soft);color:var(--todo)}.pill.s-doing{background:var(--doing-soft);color:var(--doing)}
.pill.s-blocked{background:var(--blocked-soft);color:var(--blocked)}.pill.s-done{background:var(--done-soft);color:var(--done)}
.warn{font-size:12px;color:var(--blocked)}
/* list */
.group{overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gh h2{font-size:1rem;margin:0;font-weight:600}
.gh .g{color:var(--muted);font-size:13px;margin-top:2px}
.gh .c{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);cursor:pointer;margin:0}
.row .open{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;min-width:0}
.row .open:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.row .open .t{overflow:hidden;text-overflow:ellipsis}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .m{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:640px){.row{grid-template-columns:auto minmax(0,1fr)}.row .m{grid-column:2;justify-content:flex-start}}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* timeline */
.tl{padding:16px 18px}
.tl .months{position:relative;height:22px;margin-left:var(--lab);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tl .months span{position:absolute;top:0;transform:translateX(2px);white-space:nowrap}
.tl .r{display:grid;grid-template-columns:var(--lab) 1fr;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.tl .lab{font-size:13px;padding-right:10px;line-height:1.3}
.tl .lab small{display:block;color:var(--muted);font-size:11.5px}
.tl .track{position:relative;height:100%;min-height:44px}
.tl .seg{position:absolute;top:11px;height:22px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;cursor:pointer}
.tl .seg.buf{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);border-color:var(--line);cursor:default}
.tl .seg i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.55}
.tl .seg b{position:relative;font-size:11px;font-weight:600;padding:0 6px;line-height:20px;white-space:nowrap}
.tl .today{position:absolute;top:0;bottom:0;width:2px;background:var(--blocked);pointer-events:none}
.tl-wrap{position:relative;--lab:200px}
@media (max-width:640px){.tl-wrap{--lab:110px}}
/* refs */
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.refs section{padding:14px 16px}
.refs h2{font-size:1rem;margin:0 0 10px;font-weight:600}
.refs ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.refs a{color:var(--accent);text-decoration:none}.refs a:hover{text-decoration:underline}
.refs .n{color:var(--muted);font-size:13px}
.risk{display:flex;flex-direction:column;gap:2px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(560px,calc(100% - 20px));z-index:50;display:flex;flex-direction:column;background:var(--glass-strong)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.dh h2{margin:0;font-size:1.05rem}
.db{overflow:auto;padding:14px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.db label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.db .full{grid-column:1/-1}
.db textarea{min-height:84px;resize:vertical;font-size:13.5px;line-height:1.45}
.db textarea.mono{font-family:var(--mono);font-size:12.5px}
.deps{display:flex;flex-wrap:wrap;gap:6px}
.deps button{all:unset;cursor:pointer;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--glass)}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .sp{flex:1}
.err{color:var(--blocked);font-size:12.5px}
/* steps */
.sbar{display:block;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.pill.sp{font-variant-numeric:tabular-nums}
.next .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.next .ns{color:var(--muted);font-size:12px;line-height:1.35}
.stepbox{display:flex;flex-direction:column;gap:6px}
.stepbox .sh{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:10px}
.stepbox .sh b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
ol.steps,ol.substeps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.db label.stp,label.stp{display:flex;flex-direction:row;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--fg);font-weight:400;line-height:1.45}
label.stp:hover{background:var(--line)}
label.stp input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--done);flex:none;cursor:pointer}
label.stp .sn{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:1.7em;text-align:right;padding-top:2px;flex:none}
label.stp.ok .stx{text-decoration:line-through;color:var(--muted)}
.db details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
.db details textarea{width:100%;margin-top:6px;min-height:170px}
.row ol.substeps{grid-column:1/-1;padding:2px 0 4px 22px}
.row ol.substeps label.stp{font-size:13px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function(){
var SC='</'+'script>';
var TITLE='Tahoe UI cho Hyprland + Quickshell';
var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">';
var S=JSON.parse(document.getElementById('state').textContent);
function normSteps(t){t.steps=(t.steps||[]).map(function(x){return typeof x==='string'?{s:x,ok:false}:{s:String((x&&x.s)||''),ok:!!(x&&x.ok)};}).filter(function(x){return x.s;});}
S.tasks.forEach(normSteps);
var CSS=document.getElementById('css').textContent;
var MAIN=document.getElementById('main').textContent;
var STAT=[['todo','Chưa làm'],['doing','Đang làm'],['blocked','Bị chặn'],['done','Xong']];
var STN={};STAT.forEach(function(s){STN[s[0]]=s[1];});
var PRI={1:'Cao',2:'Trung bình',3:'Thấp'};
var VIEWS=[['board','Bảng'],['list','Danh sách'],['timeline','Lộ trình'],['refs','Tài liệu & rủi ro']];
var app=document.getElementById('app');
var art=null,canSave=null,saveTimer=null,save='init',dragId=null;
var ui={view:'board',ph:'',area:'',pri:'',hideDone:false,showSteps:true,q:'',open:null,isNew:false,delArm:false,err:''};
try{var u=JSON.parse(localStorage.getItem('tahoe-ui')||'{}');['view','ph','area','pri','hideDone','showSteps','open'].forEach(function(k){if(u[k]!==undefined)ui[k]=u[k];});}catch(e){}
var h=(location.hash||'').slice(1);if(VIEWS.some(function(v){return v[0]===h;}))ui.view=h;
if(ui.open&&!task(ui.open))ui.open=null;
function keep(){try{localStorage.setItem('tahoe-ui',JSON.stringify({view:ui.view,ph:ui.ph,area:ui.area,pri:ui.pri,hideDone:ui.hideDone,showSteps:ui.showSteps,open:ui.open}));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function task(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null;}
function phase(id){for(var i=0;i<S.phases.length;i++)if(S.phases[i].id===id)return S.phases[i];return null;}
function d(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmt(s){var x=d(s);return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function areas(){var a=[];S.tasks.forEach(function(t){if(a.indexOf(t.area)<0)a.push(t.area);});return a.sort();}
function sc(t){var n=0,a=t.steps||[];a.forEach(function(x){if(x.ok)n++;});return [n,a.length];}
function nextStep(t){var a=t.steps||[];for(var i=0;i<a.length;i++)if(!a[i].ok)return {i:i,s:a[i].s};return null;}
function spill(t){var c=sc(t);if(!c[1])return '';return '<span class="pill sp">'+c[0]+'/'+c[1]+' bước</span>';}
function sbar(t){var c=sc(t);if(!c[1]||!c[0])return '';return '<span class="sbar" aria-hidden="true"><i style="width:'+Math.round(c[0]/c[1]*100)+'%"></i></span>';}
function autoSt(t){var c=sc(t);if(!c[1])return;if(c[0]===c[1])t.st='done';else if(c[0]>0&&(t.st==='todo'||t.st==='done'))t.st='doing';else if(c[0]===0&&t.st==='done')t.st='todo';}
function stepRow(t,x,i,act){return '<li><label class="stp'+(x.ok?' ok':'')+'"><input type="checkbox" data-act="'+act+'" data-id="'+t.id+'" data-i="'+i+'"'+(x.ok?' checked':'')+' aria-label="'+t.id+' bước '+(i+1)+'"><span class="sn">'+(i+1)+'</span><span class="stx">'+esc(x.s)+'</span></label></li>';}
function subSteps(t){if(!(t.steps||[]).length)return '';var o='<ol class="substeps">';t.steps.forEach(function(x,i){o+=stepRow(t,x,i,'lstep');});return o+'</ol>';}
function depsOpen(t){return (t.dep||[]).filter(function(id){var x=task(id);return x&&x.st!=='done';});}
function filtered(){var q=ui.q.trim().toLowerCase();return S.tasks.filter(function(t){
  if(ui.ph&&t.ph!==ui.ph)return false;if(ui.area&&t.area!==ui.area)return false;if(ui.pri&&String(t.pri)!==ui.pri)return false;
  if(ui.hideDone&&t.st==='done')return false;
  if(q){var hay=(t.id+' '+t.t+' '+(t.steps||[]).map(function(x){return x.s;}).join(' ')+' '+(t.files||[]).join(' ')+' '+t.notes).toLowerCase();if(hay.indexOf(q)<0)return false;}
  return true;});}
function curPhase(){var n=today(),list=S.phases.filter(function(p){return !p.buffer;});
  for(var i=0;i<S.phases.length;i++){var p=S.phases[i];if(d(p.start)<=n&&n<=d(p.end))return {p:p,now:true};}
  for(var j=0;j<list.length;j++)if(d(list[j].start)>n)return {p:list[j],now:false};return {p:list[list.length-1],now:false};}
function pills(t){var o='<span class="pill s-'+t.st+'">'+STN[t.st]+'</span>';
